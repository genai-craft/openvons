[project]
name = "openvons"
version = "0.1.0"
description = "openvons (open-Jev): 有限選択肢に確率で答える判断層 — テキスト / 画像 / 音声コマンド"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.13", "torchaudio", "transformers>=5.17", "accelerate", "peft", "datasets", "scikit-learn",
  "numpy", "scipy", "soundfile", "librosa", "pillow", "tqdm", "pandas",
  "pyopenjtalk", "jaconv", "rapidfuzz", "silero-vad", "httpx",
  "fastapi", "uvicorn[standard]", "websockets", "python-multipart", "pydantic",
]

[project.optional-dependencies]
dev = ["pytest"]
serve = ["vllm"]          # LLM ベースライン / 教師 (任意)
jevpick = ["dflash", "matplotlib", "requests", "bitsandbytes", "kernels==0.16.0"]   # 先読み (JevPick): DFlash 公式 draft、図、4-bit/FP8 量子化

[tool.setuptools]
packages = ["openvons", "openvons.core", "openvons.voice", "openvons.voice.distill", "openvons.lm", "openvons.lm.models", "openvons.lm.training", "openvons.lm.backends", "openvons.lm.teacher", "openvons.lm.api", "openvons.lm.benchmark", "openvons.vision", "openvons.tts", "jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
